services:
  - type: web
    name: sriya-web-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: WEBAPP_USERNAME
        sync: false
      - key: WEBAPP_PASSWORD
        sync: false
      - key: WEBAPP_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: WEBAPP_PORT
        value: "8005"
      - key: DATA_DIR
        value: /tmp
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CROSS_ORIGIN_COOKIES
        value: "1"
